#cloud-config
users:
  - name: distadmin
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [sudo, docker]
    shell: /bin/bash
    lock_passwd: false

chpasswd:
  list: |
     distadmin:tera
  expire: False

package_update: true
package_upgrade: true

packages:
  - openssh-server
  - curl
  - git
  - build-essential
  - docker.io
  - nfs-kernel-server
  - nfs-common
  - net-tools
  - htop
  - python3
  - python3-pip
  - python3-venv

runcmd:
  # Enable services
  - [ systemctl, enable, ssh ]
  - [ systemctl, start, ssh ]
  - [ systemctl, enable, docker ]
  - [ systemctl, start, docker ]
  # Setup shared directory for NFS
  - [ mkdir, -p, /shared ]
  - [ chown, -R, "distadmin:distadmin", /shared ]
  - [ chmod, 777, /shared ]
  # Setup ssh directory
  - [ mkdir, -p, /home/distadmin/.ssh ]
  - [ chown, -R, "distadmin:distadmin", /home/distadmin/.ssh ]
  - [ chmod, 700, /home/distadmin/.ssh ]
